<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a13">
<title>NachoVuela — la terminal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/logo-mark.svg">
<link rel="apple-touch-icon" href="assets/logo-mark.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NachoVuela">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="cine.css">
<link rel="stylesheet" href="escenas/terminal.css">
<link rel="stylesheet" href="escenas/mac.css">
<link rel="stylesheet" href="escenas/board.css">
<link rel="stylesheet" href="escenas/revista.css">
</head>
<body class="cine">

<!-- Puerta de entrada -->
<div class="lock" id="lock" hidden>
  <div class="lock__box">
    <img src="assets/logo-mark.svg" alt="" width="84" height="84" class="lock__logo">
    <div class="lock__name">Nacho<em>Vuela</em></div>
    <p class="lock__sub">radar privado · ingresá tu clave</p>
    <form id="lockForm" autocomplete="off">
      <input type="password" id="lockPin" class="lock__input" placeholder="••••••••" inputmode="text" autocomplete="off">
      <button type="submit" class="lock__btn">Entrar ✈</button>
    </form>
    <p class="lock__err" id="lockErr" hidden>Clave incorrecta, probá de nuevo</p>
  </div>
</div>

<!-- El viaje: su altura es el tiempo del relato -->
<div id="viaje">
  <!-- El escenario queda fijo; lo que cambia es el momento -->
  <div id="escenario">
    <!-- las escenas se insertan acá -->
  </div>
</div>

<!-- Barra fija: logo + estado del radar + guía de scroll -->
<header class="hud">
  <a class="hud__marca" href="#" id="hudTop">
    <img src="assets/logo-mark.svg" alt="" width="34" height="34">
    <span>Nacho<em>Vuela</em></span>
  </a>
  <div class="hud__estado" id="hudEstado"></div>
</header>

<div class="guia" id="guia" aria-hidden="true">
  <span class="guia__txt">scrolleá</span>
  <span class="guia__flecha"></span>
</div>

<!-- Riel de capítulos: dónde estás en el relato -->
<nav class="riel" id="riel" aria-label="Momentos"></nav>

<!-- Hoja reutilizada de la app: Armador y fichas de destino -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet__backdrop" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true">
    <button class="sheet__close" data-close aria-label="Cerrar">✕</button>
    <div class="sheet__body" id="sheetBody"></div>
  </div>
</div>

<script>window.NV_CINE = true;</script>
<script src="app.js"></script>
<script src="cine.js"></script>
<script src="escenas/terminal.js"></script>
<script src="escenas/mac.js"></script>
<script src="escenas/board.js"></script>
<script src="escenas/revista.js"></script>
<script src="arranque.js"></script>
</body>
</html>
