<svg width="420" height="120" viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NachoVuela">
  <!-- Versión para bordar en la gorra: dos tonos, trazos gruesos, legible en chico -->
  <g transform="translate(8 22)">
    <!-- avioncito -->
    <g transform="translate(34 36) rotate(-32)">
      <path d="M-30 0 L34 -1 L-13 20 Z" fill="#ffd479"/>
      <path d="M-30 0 L-13 20 L-17 4 Z" fill="#d98a18"/>
    </g>
    <!-- arco de vuelo -->
    <path d="M4 62 Q34 20 66 34" fill="none" stroke="#ffd479" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="0.5 11" opacity="0.75"/>
  </g>
  <text x="96" y="72" font-family="Fraunces, Georgia, serif" font-size="46"
        font-weight="900" fill="#f4efe2" letter-spacing="-0.5">Nacho<tspan
        fill="#ffb340" font-style="italic" font-weight="600">Vuela</tspan></text>
</svg>
