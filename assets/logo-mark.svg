<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NachoVuela">
  <defs>
    <radialGradient id="nvFondo" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#1a2544"/>
      <stop offset="62%" stop-color="#0d1223"/>
      <stop offset="100%" stop-color="#070a13"/>
    </radialGradient>
    <linearGradient id="nvAmbar" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffe3a6"/>
      <stop offset="40%" stop-color="#ffd479"/>
      <stop offset="78%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#e07a15"/>
    </linearGradient>
    <linearGradient id="nvAla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#c96a12"/>
    </linearGradient>
    <linearGradient id="nvBarrido" x1="0.5" y1="0" x2="1" y2="0.75">
      <stop offset="0%" stop-color="#ffd479" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#f5a623" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </linearGradient>
    <filter id="nvBrillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#nvFondo)"/>
  <rect x="1" y="1" width="510" height="510" rx="117" fill="none"
        stroke="#2b3757" stroke-width="2" opacity="0.75"/>

  <!-- Scope: dos anillos abiertos arriba, como una mira de radar -->
  <g fill="none" stroke="#2e3c5e" stroke-linecap="round">
    <circle cx="256" cy="256" r="176" stroke-width="3"
            stroke-dasharray="820 1106" stroke-dashoffset="-138"/>
    <circle cx="256" cy="256" r="120" stroke-width="2.5" opacity="0.72"
            stroke-dasharray="560 754" stroke-dashoffset="-94"/>
    <circle cx="256" cy="256" r="64" stroke-width="2" opacity="0.45"/>
  </g>

  <!-- Marcas de rumbo -->
  <g stroke="#3a4a70" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="60" x2="256" y2="86"/>
    <line x1="256" y1="426" x2="256" y2="452"/>
    <line x1="60" y1="256" x2="86" y2="256"/>
    <line x1="426" y1="256" x2="452" y2="256"/>
  </g>

  <!-- Barrido -->
  <path d="M256 256 L256 80 A176 176 0 0 1 405 175 Z" fill="url(#nvBarrido)"/>

  <!-- Estela: el rastro que viene siguiendo el radar -->
  <path d="M128 372 Q196 330 250 286" fill="none" stroke="url(#nvAmbar)"
        stroke-width="13" stroke-linecap="round" stroke-dasharray="0.5 34"
        opacity="0.5"/>
  <path d="M150 352 Q210 316 258 278" fill="none" stroke="url(#nvAmbar)"
        stroke-width="9" stroke-linecap="round" stroke-dasharray="0.5 30"
        opacity="0.28"/>

  <!-- El avión: héroe del logo, ascendiendo a 34° -->
  <g filter="url(#nvBrillo)" transform="translate(258 250) rotate(-34) scale(0.94)">
    <!-- cuerpo superior -->
    <path d="M-96 0 L104 -3 L-40 62 Z" fill="url(#nvAmbar)"/>
    <!-- ala inferior en sombra, da volumen -->
    <path d="M-96 0 L-40 62 L-52 12 Z" fill="url(#nvAla)"/>
    <!-- quilla clara -->
    <path d="M-96 0 L104 -3 L-30 26 Z" fill="#fff2d2" opacity="0.92"/>
  </g>

  <!-- Blip detectado -->
  <circle cx="150" cy="352" r="9" fill="#34e0a1"/>
  <circle cx="150" cy="352" r="20" fill="none" stroke="#34e0a1" stroke-width="2.5" opacity="0.45"/>
</svg>
